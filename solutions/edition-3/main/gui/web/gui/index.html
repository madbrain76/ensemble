<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ensemble · Live session</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><div><h1>Ensemble</h1><span class="muted">Live conversation</span></div><div id="connection" role="status">Connecting…</div><button id="menu-toggle" aria-expanded="false" aria-controls="menu">Session ▾</button></header>
<aside id="menu" hidden><label>Agent <select id="agent"></select></label><dl><dt>Vendor</dt><dd id="vendor">—</dd><dt>Model</dt><dd id="model">—</dd><dt>Surface</dt><dd id="surface">—</dd></dl><p>Local session. History replay is silent.</p><label class="check"><input type="checkbox" id="speaking"> Speaking</label><label class="check"><input type="checkbox" id="mic"> Microphone recognition active (local input seam)</label><p class="muted">Mic starts off. No recognizer or audio capture is installed.</p><p id="audio-status" role="status">Speech disabled</p></aside>
<main><section class="session"><span id="state" role="status">Idle</span><span id="reason" class="muted"></span><div class="actions"><button id="pause">Pause</button><button id="continue">Continue</button><button id="interrupt" class="danger">Interrupt</button><button id="cancel-audio">Cancel audio</button></div></section><div id="errors" role="alert"></div><section id="conversation" aria-label="Conversation"></section><button id="follow" hidden>Jump to latest ↓</button></main>
<footer><form id="composer"><label class="sr-only" for="input">Message or hint</label><textarea id="input" rows="2" placeholder="Message Ensemble… (Ctrl/⌘ + Enter to send)"></textarea><div><button type="button" id="hint">Send hint</button><button type="submit" class="primary">Send</button></div></form><p class="muted">Pause stops at the next safe boundary. Continue in any tab releases the Agent.</p></footer>
</body></html>
